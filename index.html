<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>111 Master Web - Panel de Control</title>
</head>
<body>
    <h1>Proyecto: Master-Web-Admin</h1>
    <h3>Estado del sitio Albani Vegas:</h3>
    
    <!-- He cambiado el botón por un checkbox -->
    <div style="font-size: 24px;">
        <input type="checkbox" id="check-estado" onclick="cambiarEstado()" style="width: 30px; height: 30px; cursor: pointer;">
        <label for="check-estado" id="label-estado">Cargando...</label>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA0DzUikltEZ4Iu1a3aRkCRr68jzuoTUyQ",
            authDomain: "master-web-admin.firebaseapp.com",
            projectId: "master-web-admin",
            storageBucket: "master-web-admin.firebasestorage.app",
            messagingSenderId: "641570363282",
            appId: "1:641570363282:web:b027b5c4c036a550b8534b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const docRef = doc(db, "Master_web", "albani_vegas");
        const checkbox = document.getElementById('check-estado');
        const label = document.getElementById('label-estado');

        async function cargarEstado() {
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                const activo = docSnap.data().activo;
                checkbox.checked = activo;
                label.innerText = activo ? " SITIO ACTIVO" : " SITIO APAGADO";
            }
        }

        window.cambiarEstado = async () => {
            const nuevoEstado = checkbox.checked;
            await updateDoc(docRef, { activo: nuevoEstado });
            label.innerText = nuevoEstado ? " SITIO ACTIVO" : " SITIO APAGADO";
        };

        cargarEstado();
    </script>
</body>
</html>
