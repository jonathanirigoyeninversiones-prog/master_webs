<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Master Web - Panel de Control</title>
</head>
<body>
    <h1>Panel de Control Master Web</h1>
    <div id="app">Cargando datos...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCN2ah_fSjW385KgAb48W8Cd9PhFDOQJ0",
            authDomain: "estilista-demo.firebaseapp.com",
            projectId: "estilista-demo",
            storageBucket: "estilista-demo.firebasestorage.app",
            messagingSenderId: "652196958867",
            appId: "1:652196958867:web:1c860102aa769ea6787366",
            measurementId: "G-DTB0D8XRWK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const colRef = collection(db, "clientes_servicios");
        const appContainer = document.getElementById('app');

        onSnapshot(colRef, (snapshot) => {
            appContainer.innerHTML = '';
            if (snapshot.empty) {
                appContainer.innerHTML = 'No hay clientes encontrados en la base de datos.';
                return;
            }
            
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;
                
                const btn = document.createElement('button');
                btn.innerText = (data.nombre || id) + " (" + (data.activo ? "ACTIVO" : "APAGADO") + ")";
                btn.style.backgroundColor = data.activo ? "#4CAF50" : "#808080";
                btn.style.color = "white";
                btn.style.padding = "20px";
                btn.style.margin = "10px";
                btn.style.cursor = "pointer";

                btn.onclick = async () => {
                    const docRef = doc(db, "clientes_servicios", id);
                    await updateDoc(docRef, { activo: !data.activo });
                };
                appContainer.appendChild(btn);
            });
        }, (error) => {
            appContainer.innerHTML = 'Error al conectar: ' + error.message;
        });
    </script>
</body>
</html>
