<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>111 Peluquería Dani - Reservas</title>
    <!-- Aquí irían tus estilos CSS actuales, mantén los que ya tenías -->
    <style>
        body { font-family: sans-serif; padding: 20px; }
    </style>
</head>
<body>

    <!-- TODO TU CONTENIDO ACTUAL DE LA PÁGINA IRÍA AQUÍ -->
    <h1>Bienvenido a Peluquería Dani</h1>
    <p>Realiza tus reservas aquí.</p>

    <!-- ESTE ES EL CÓDIGO QUE "VIGILA" EL ESTADO -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCN2ah_fSjW385KgAb48W8Cd9PhFDOQJ0",
            authDomain: "estilista-demo.firebaseapp.com",
            projectId: "estilista-demo",
            storageBucket: "estilista-demo.firebasestorage.app",
            messagingSenderId: "652196958867",
            appId: "1:652196958867:web:1c860102aa769ea6787366",
            measurementId: "G-DTB0D8XRWK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Vigilamos el documento 'unasdani' en la colección 'clientes_servicios'
        const docRef = doc(db, "clientes_servicios", "unasdani");

        onSnapshot(docRef, (doc) => {
            if (doc.exists()) {
                const data = doc.data();
                // Si 'activo' es falso, mostramos mensaje de bloqueo
                if (data.activo === false) {
                    document.body.innerHTML = `
                        <div style="text-align:center; padding: 50px; font-family: sans-serif;">
                            <h1>Servicio Temporalmente Inactivo</h1>
                            <p>Lo sentimos, este servicio no está disponible en este momento.</p>
                        </div>
                    `;
                }
            }
        });
    </script>
</body>
</html>
