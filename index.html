<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Master Web - Control de Servidores</title>
    <!-- Incluimos Firebase desde su servidor oficial -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // Tu configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDCN2ah_fSjW385KgAb48W8Cd9PhFDOQJ0",
            authDomain: "estilista-demo.firebaseapp.com",
            projectId: "estilista-demo",
            storageBucket: "estilista-demo.firebasestorage.app",
            messagingSenderId: "652196958867",
            appId: "1:652196958867:web:1c860102aa769ea6787366",
            measurementId: "G-DTB0D8XRWK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Referencia a la colección
        const colRef = collection(db, "clientes_servicios");
        const appContainer = document.getElementById('app');

        // Leer datos en tiempo real
        onSnapshot(colRef, (snapshot) => {
            appContainer.innerHTML = '';
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;
                
                const btn = document.createElement('button');
                btn.innerText = data.nombre + (data.activo ? " (ACTIVO)" : " (APAGADO)");
                btn.style.backgroundColor = data.activo ? "#4CAF50" : "#808080";
                btn.style.color = "white";
                btn.style.padding = "20px";
                btn.style.margin = "10px";
                btn.style.border = "none";
                btn.style.cursor = "pointer";

                // Al hacer clic, cambia el estado en Firebase
                btn.onclick = async () => {
                    const docRef = doc(db, "clientes_servicios", id);
                    await updateDoc(docRef, { activo: !data.activo });
                };

                appContainer.appendChild(btn);
            });
        });
    </script>
</head>
<body>
    <h1>Panel de Control Master Web</h1>
    <div id="app">Cargando servicios...</div>
</body>
</html>
