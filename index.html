<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Master Web - Panel de Control</title>
</head>
<body>
    <h1>Proyecto: Master-Web-Admin</h1>
    <h3>Estado del sitio Albani Vegas:</h3>
    <button id="btn-estado" onclick="cambiarEstado()" style="padding: 20px; font-size: 20px; cursor: pointer;">Cargando...</button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        // PEGA AQUÍ TU CONFIGURACIÓN DE MASTER-WEB-ADMIN
        const firebaseConfig = {
            apiKey: "AIzaSyA0DzUikltEZ4Iu1a3aRkCRr68jzuoTUyQ",
            authDomain: "master-web-admin.firebaseapp.com",
            projectId: "master-web-admin",
            storageBucket: "master-web-admin.firebasestorage.app",
            messagingSenderId: "641570363282",
            appId: "1:641570363282:web:b027b5c4c036a550b8534b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const docRef = doc(db, "Master_web", "albani_vegas");
        let estadoActual = true;

        async function cargarEstado() {
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                estadoActual = docSnap.data().activo;
                actualizarBoton();
            }
        }

        function actualizarBoton() {
            const btn = document.getElementById('btn-estado');
            btn.innerText = estadoActual ? "✅ SITIO ACTIVO" : "❌ SITIO APAGADO";
            btn.style.backgroundColor = estadoActual ? "#90EE90" : "#FFB6C1";
        }

        window.cambiarEstado = async () => {
            estadoActual = !estadoActual;
            await updateDoc(docRef, { activo: estadoActual });
            actualizarBoton();
        };

        cargarEstado();
    </script>
</body>
</html>
